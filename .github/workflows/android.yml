name: Scanix Android Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_channel:
        description: "Choose the update channel for this APK"
        required: true
        type: choice
        options:
          - github
          - uptodown
        default: github

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Scanix Release APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ENCRYPTION_PASSWORD: ${{ secrets.KEYSTORE_ENCRYPTION_PASSWORD }}
      KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.KEYSTORE_ENCRYPTED_BASE64 }}
      KEY_ALIAS: scanix-release
      KEYSTORE_PATH: ${{ github.workspace }}/scanix-release.keystore
      UPDATE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.update_channel || 'github' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Restore and decrypt release keystore
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing KEYSTORE_PASSWORD secret."
            exit 1
          fi

          if [ -z "$KEYSTORE_ENCRYPTION_PASSWORD" ]; then
            echo "Missing KEYSTORE_ENCRYPTION_PASSWORD secret."
            exit 1
          fi

          if [ -z "$KEYSTORE_ENCRYPTED_BASE64" ]; then
            echo "Missing KEYSTORE_ENCRYPTED_BASE64 secret."
            exit 1
          fi

          printf '%s' "$KEYSTORE_ENCRYPTED_BASE64" \
            | base64 --decode > scanix-release.keystore.enc

          openssl enc -d -aes-256-cbc \
            -pbkdf2 \
            -iter 600000 \
            -in scanix-release.keystore.enc \
            -out "$KEYSTORE_PATH" \
            -pass env:KEYSTORE_ENCRYPTION_PASSWORD

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Build signed release APK
        run: |
          gradle --no-daemon assembleRelease \
            "-PscanixUpdateChannel=$UPDATE_CHANNEL"

      - name: Upload signed release APK only
        uses: actions/upload-artifact@v4
        with:
          name: Scanix-QR-${{ github.event_name == 'workflow_dispatch' && inputs.update_channel || 'github' }}-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f scanix-release.keystore
          rm -f scanix-release.keystore.enc
