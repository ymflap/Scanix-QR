name: Create Scanix Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-signing-key:
    name: Generate and Encrypt Release Key
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "${#KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "The keystore password must contain at least 6 characters."
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore scanix-release.keystore \
            -storetype PKCS12 \
            -alias scanix-release \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Scanix QR, OU=Android, O=Scanix, L=Cairo, ST=Cairo, C=EG"

      - name: Encrypt keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENCRYPTION_PASSWORD: ${{ secrets.KEYSTORE_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "${#KEYSTORE_ENCRYPTION_PASSWORD}" -lt 12 ]; then
            echo "The encryption password must contain at least 12 characters."
            exit 1
          fi

          openssl enc -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 600000 \
            -in scanix-release.keystore \
            -out scanix-release.keystore.enc \
            -pass env:KEYSTORE_ENCRYPTION_PASSWORD

          keytool -list \
            -keystore scanix-release.keystore \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias scanix-release

      - name: Remove unencrypted keystore
        if: always()
        run: |
          rm -f scanix-release.keystore

      - name: Upload encrypted keystore only
        uses: actions/upload-artifact@v4
        with:
          name: Scanix-Encrypted-Release-Key
          path: scanix-release.keystore.enc
          if-no-files-found: error
          retention-days: 7
          
